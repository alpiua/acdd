apiVersion: acdd/adapter/v1
kind: adapter
id: simple-plan/v1
role: plan
provides: [plan_read, plan_write, evidence_map, architecture_map, impact, validate_plan, validate_roadmap, validate_milestone, validate_decomposition, publish_plan, independent_review, review_execution]
procedure: references/simple-plan.md
authority:
  primaryPlan: ../PLAN.md
  embeddedTasks: ../PLAN.md#tasks
  sourceEvidence: repository-local read-only paths
  impact:
    domains: [api-compatibility, operations]
inputAuthorities:
  bound-document: [examples/simple-plan/PLAN.md]
  source: [examples/simple-plan/**]
  test: [examples/simple-plan/**]
  configuration: [examples/simple-plan/**]
  generated: [examples/simple-plan/**]
  dependency: [examples/simple-plan/**]
  environment: [examples/simple-plan/**]
  accepted-review-findings: [examples/simple-plan/**]
resources:
  shapeContract: contracts/plan-simple-v1.yaml
gateProcedures:
  architecture/v1:
    operation: architecture-verify
    runtime: pi
    launcher:
      kind: command
      target: pi
      arguments: [--print, --session-id, "{sessionUuid}", --provider, openai-codex, --model, gpt-5.6-sol, --thinking, low, --tools, "read,grep,find,ls,mcp"]
      promptTransport: final-argument
    toolEnvelope:
      admit: [read, grep, find, ls, mcp]
      deny: [bash, edit, write, pi_review_agents]
    scope: bounded architecture coherence of the embedded plan
  review/v1:
    operation: closure-plan-review
    runtime: pi-review-agents
    launcher:
      kind: tool
      target: pi_review_agents
      arguments: []
      promptTransport: parameters
    toolEnvelope:
      admit: [pi_review_agents]
      deny: [write, edit]
    presentation: overview
    scope: complete self-contained plan
constraints:
  - Exactly one self-contained primary plan binds to its own milestone section.
  - Tasks are embedded under the primary plan Tasks section.
  - Planning leaves every embedded task todo and performs no activation.
  - Roadmap phase task-file current-execution issue-tracker and derived-index authority are absent.
  - The adapter follows acdd/plan/simple/v1 and does not redefine its task fields statuses or closure semantics.
receipts:
  format: primary-plan ordered receipts and blockers
  closure: blockers are empty and every completed embedded task has current evidence
