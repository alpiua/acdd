apiVersion: acdd/adapter/v1
id: independent-reviewer
role: review
artifactDir: artifacts
gates:
  review/v1:
    checks:
      # Review host launch template; core fingerprints it. Register the finished
      # transcript with `acdd review`. Placeholders: {document}, {evidenceId},
      # {reviewerSessionUuid}, {prompt}.
      # Run inside one owning git repo for the settled Build/plan tree.
      # Not contract-verify: do not span separate Planner + implementation roots.
      independent-review:
        argv:
          - node
          - plugins/pi-review-agents/bin/pi-review.mjs
          - --print
          - --session-id
          - "{reviewerSessionUuid}"
          - "{prompt}"
