apiVersion: acdd/adapter/v1
id: example-implementation
role: implementation
artifactDir: artifacts
gates:
  build/v1:
    checks:
      # Adjustable per repository:
      #   timeoutSeconds — bound for the integrated proof (default 300)
      #   promptAppend   — extra agent context, hashed into the fingerprint
      #                     (do not edit after a terminal Build receipt)
      runtime-and-integration:
        cwd: .
        argv: [uv, run, pytest, -q]
        timeoutSeconds: 900
