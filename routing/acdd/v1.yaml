apiVersion: acdd/v1
kind: gate-routing
id: acdd/routing/v1
profile: ../../profiles/acdd/v1.yaml
routes:
  matrix/v1:
    adapters: [task, implementation]
    receipt: coverage matrix and unresolved blockers
  architecture/v1:
    adapters: [task, implementation, review]
    receipt: independent architecture decision
  red/v1:
    adapters: [task, implementation]
    receipt: expected failing proof
  runtime/v1:
    adapters: [task, implementation]
    receipt: focused production-path proof
  parity/v1:
    adapters: [task, implementation]
    receipt: applicable parity evidence
  security/v1:
    adapters: [task, implementation]
    receipt: applicable security evidence
  release/v1:
    adapters: [task, implementation]
    receipt: exact release command result
  review/v1:
    adapters: [task, implementation, review]
    receipt: independent terminal review
  handoff/v1:
    adapters: [task, implementation]
    receipt: checkpoint with empty blockers
