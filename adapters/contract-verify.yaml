apiVersion: acdd/adapter/v1
id: example-contract-verify
role: contract-verify
artifactDir: artifacts
gates:
  contract/v1:
    checks:
      # Host launch template; register the finished transcript with `acdd review`
      # (--gate contract/v1 --check contract-verify). ACDD does not create sessions.
      # Placeholders: {document}, {evidenceId}, {reviewerSessionUuid}, {prompt}.
      # Host must give READ access to the contract document and cited code roots.
      # Replace argv with the repository review-host CLI.
      contract-verify:
        argv:
          - review-host
          - --print
          - --session-id
          - "{reviewerSessionUuid}"
          - "{prompt}"
  decompose/v1:
    checks:
      # Same host-template rules as contract/v1; planning-set substance only.
      contract-verify:
        argv:
          - review-host
          - --print
          - --session-id
          - "{reviewerSessionUuid}"
          - "{prompt}"
