---
apiVersion: acdd/task/v1
kind: delivery-profile
id: acdd/task/v1
title: Evidence-bound task delivery
capabilityContract: ../../contracts/task/v1.yaml
adapterContract: ../../contracts/adapter/v1.yaml
receiptContract: ../../contracts/receipt/task/v1.yaml
workflowLearningContract: ../../contracts/workflow-learning/v1.yaml
routing: ../../routing/task/v1.yaml
gates:
  - {id: matrix/v1, queue: 10, name: Coverage matrix, purpose: Bind task coverage to live owners before implementation., capabilities: [task_read, impact, source_map, docs_search, structural_search, task_write], guidance: {skill: acdd-task, prompt: Record affected domains, owners, propagation, authorization, proof IDs, and blockers; load adapter-required axes such as deployment.}}
  - {id: architecture/v1, queue: 20, name: Architecture review, purpose: Independently test the proposed owner production path impact boundaries and contradictions., capabilities: [task_read, impact, source_map, structural_search, independent_review, review_execution, task_write], guidance: {skill: acdd-task, prompt: Run the adapter-selected review mode to terminal PASS or record a blocker; review evidence never authorizes impact expansion.}}
  - {id: red/v1, queue: 30, name: Expected failing proof, purpose: Demonstrate the scoped missing behavior before implementation., capabilities: [run_gate, task_write], guidance: {skill: tdd, prompt: Run the smallest proof that exposes the stated gap.}}
  - {id: runtime/v1, queue: 40, name: Focused runtime proof, purpose: Prove the production path after implementation., capabilities: [run_gate, task_write], guidance: {skill: acdd-task, prompt: Prove the real caller path and relevant failure path.}}
  - {id: parity/v1, queue: 50, name: Parity verification, purpose: Prove behavior failures authorization owner paths and lifecycle., capabilities: [source_map, structural_search, run_gate, task_write], guidance: {skill: acdd-task, prompt: Record every applicable parity dimension.}}
  - {id: security/v1, queue: 60, name: Final security, purpose: Verify authorization payload lifecycle and external-effect contours., capabilities: [run_gate, structural_search, task_write], guidance: {skill: acdd-task, prompt: Record each applicable security contour and proof.}}
  - {id: release/v1, queue: 70, name: Release gate, purpose: Run the exact bounded repository gate., capabilities: [run_gate, task_write], guidance: {skill: acdd-task, prompt: Run and record the task-appropriate release command.}}
  - {id: review/v1, queue: 80, name: Terminal review, purpose: Classify independent findings against the approved task contract., capabilities: [independent_review, review_execution, task_write], guidance: {skill: acdd-task, prompt: Run the adapter-selected review mode through terminal completion, resolve accepted findings, and record residual risk or blockers.}}
  - {id: handoff/v1, queue: 90, name: Handoff checkpoint, purpose: Confirm current evidence and honest blockers., capabilities: [task_read, task_write], guidance: {skill: acdd-task, prompt: Record a final checkpoint and close only when blockers are empty.}}
