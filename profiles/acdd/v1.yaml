apiVersion: acdd/v1
kind: delivery-profile
id: acdd/v1
title: Evidence-bound delivery
capabilityContract: ../../contracts/acdd/v1.yaml
adapterContract: ../../contracts/adapter/v1.yaml
receiptContract: ../../contracts/receipt/v1.yaml
routing: ../../routing/acdd/v1.yaml
gates:
  - id: matrix/v1
    queue: 10
    name: Coverage matrix
    purpose: Bind task coverage to live owners before implementation.
    capabilities: [task_read, source_map, docs_search, structural_search, task_write]
    guidance:
      skill: acdd-workflow
      prompt: Record coverage, owners, proof IDs, and blockers.
  - id: architecture/v1
    queue: 20
    name: Architecture review
    purpose: Independently test the proposed owner, production path, and contradictions.
    capabilities: [task_read, source_map, structural_search, independent_review, task_write]
    guidance:
      skill: acdd-workflow
      prompt: Confirm one coherent production path or record a blocker.
  - id: red/v1
    queue: 30
    name: Expected failing proof
    purpose: Demonstrate the scoped missing behavior before implementation.
    capabilities: [run_gate, task_write]
    guidance:
      skill: tdd
      prompt: Run the smallest proof that exposes the stated gap.
  - id: runtime/v1
    queue: 40
    name: Focused runtime proof
    purpose: Prove the production path after implementation.
    capabilities: [run_gate, task_write]
    guidance:
      skill: acdd-workflow
      prompt: Prove the real caller path and relevant failure path.
  - id: parity/v1
    queue: 50
    name: Parity verification
    purpose: Prove behavior, failures, authorization, owner paths, and lifecycle.
    capabilities: [source_map, structural_search, run_gate, task_write]
    guidance:
      skill: acdd-workflow
      prompt: Record every applicable parity dimension.
  - id: security/v1
    queue: 60
    name: Final security
    purpose: Verify authorization, payload, lifecycle, and external-effect contours.
    capabilities: [run_gate, structural_search, task_write]
    guidance:
      skill: acdd-workflow
      prompt: Record each applicable security contour and proof.
  - id: release/v1
    queue: 70
    name: Release gate
    purpose: Run the exact bounded repository gate.
    capabilities: [run_gate, task_write]
    guidance:
      skill: acdd-workflow
      prompt: Run and record the task-appropriate release command.
  - id: review/v1
    queue: 80
    name: Terminal review
    purpose: Classify independent findings against the approved task contract.
    capabilities: [independent_review, task_write]
    guidance:
      skill: acdd-workflow
      prompt: Resolve accepted findings and record residual risk or blockers.
  - id: handoff/v1
    queue: 90
    name: Handoff checkpoint
    purpose: Confirm current evidence and honest blockers.
    capabilities: [task_read, task_write]
    guidance:
      skill: acdd-workflow
      prompt: Record a final checkpoint; close only when blockers are empty.
closure:
  requiredGates: [matrix/v1, architecture/v1, red/v1, runtime/v1, parity/v1, security/v1, release/v1, review/v1, handoff/v1]
  generatedRequiredGates: true
