apiVersion: acdd/receipt/v1
kind: receipt-contract
id: acdd/receipts/v1
requiredFields: [gate, status, evidence, inputFingerprint, recordedAt]
pendingStatus: pending
blockingStatus: blocked
fingerprintPattern: ^sha256:[0-9a-f]{64}$
recordedAtPattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
terminalStatuses:
  matrix/v1: [pass]
  architecture/v1: [pass]
  red/v1: [expected_failure, inapplicable]
  runtime/v1: [pass]
  parity/v1: [pass]
  security/v1: [pass]
  release/v1: [pass]
  review/v1: [pass]
  handoff/v1: [pass]
invalidationInputs:
  - task
  - source
  - tests
  - configuration
  - generated-inputs
  - dependencies
  - environment
  - accepted-review-findings
rules:
  - Every required gate has exactly one current receipt in task authority.
  - Evidence, inputFingerprint, and recordedAt are non-empty on a terminal receipt.
  - A blocked receipt records current blocker evidence, inputFingerprint, and recordedAt.
  - inputFingerprint is the SHA-256 of a canonical acdd/input-set/v1 manifest referenced by evidence.
  - Receipt-only evidence writes do not change the input manifest; task-contract changes do.
  - An inapplicable red receipt includes a task-owned rationale in its evidence.
  - Architecture and review receipts identify an independent review adapter result.
  - A changed invalidation input returns every affected receipt to pending.
  - Handoff is terminal only after every prior gate is terminal and blockers are empty.
