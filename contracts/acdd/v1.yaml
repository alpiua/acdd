apiVersion: acdd/v1
kind: capability-contract
id: acdd/capabilities/v1
title: Host-neutral ACDD coordination ports
capabilities:
  task_read:
    owner: planner-adapter
    purpose: Read the selected task and current execution state.
    authority: Planner remains authoritative.
  task_write:
    owner: planner-adapter
    purpose: Record task-owned evidence, blockers, and execution updates.
    authority: May modify only the bound task and its owned execution entry.
  source_map:
    owner: contextunity-adapter
    purpose: Establish bounded live code owners, callers, and impact.
  docs_search:
    owner: contextunity-adapter
    purpose: Retrieve task-relevant ContextUnity documentation evidence.
  structural_search:
    owner: contextunity-adapter
    purpose: Verify structural source claims after orientation.
  run_gate:
    owner: contextunity-adapter
    purpose: Run one exact scoped proof command and return its result.
  independent_review:
    owner: review-adapter
    purpose: Obtain a review independent of the task author.
rules:
  - The workflow may require a capability but may not name a host-specific tool.
  - Planner task files are the sole persistent task and evidence authority.
  - Missing required capability or evidence blocks the affected gate.
