apiVersion: acdd/v1
kind: capability-contract
id: acdd/capabilities/v1
title: Host-neutral ACDD capability ports
capabilities:
  task_read:
    purpose: Read the selected task and current execution state.
    providedBy: task-adapter
  task_write:
    purpose: Record evidence, blockers, and execution updates for the bound task.
    providedBy: task-adapter
  source_map:
    purpose: Establish bounded live owners, callers, and impact.
    providedBy: implementation-adapter
  docs_search:
    purpose: Retrieve task-relevant documentation evidence.
    providedBy: implementation-adapter
  structural_search:
    purpose: Verify source claims after orientation.
    providedBy: implementation-adapter
  run_gate:
    purpose: Run one exact scoped proof command and return its result.
    providedBy: implementation-adapter
  independent_review:
    purpose: Obtain a review independent of the task author.
    providedBy: review-adapter
rules:
  - A profile may require a capability but may not name a host-specific tool.
  - An implementation adapter may add evidence and commands but may not weaken a gate.
  - The task adapter declares the persistent task and evidence authority.
  - Missing required capability or evidence blocks the affected gate.
