[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "acdd"
version = "0.4.4"
description = "ACDD — Agentic Contract-Driven Development"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "Oleksii Pylypchuk", email = "oleksii.pylypchuk@tuta.com" },
]
keywords = [
  "acdd",
  "agentic",
  "agents",
  "agentic-workflow",
  "contract-driven-development",
  "evidence",
  "validator",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/alpiua/acdd-workflow"
Repository = "https://github.com/alpiua/acdd-workflow"
Issues = "https://github.com/alpiua/acdd-workflow/issues"
Documentation = "https://github.com/alpiua/acdd-workflow#readme"

[project.scripts]
acdd = "acdd.cli:main"

# Source lives in src/acdd. Share trees stay at the repo root.
# sdist mirrors that layout; wheel maps them into acdd/share/ so both
# checkout→wheel and sdist→wheel see the same source paths.
[tool.hatch.build.targets.wheel]
packages = ["src/acdd"]

[tool.hatch.build.targets.sdist.force-include]
"adapters" = "adapters"
"examples" = "examples"
"profiles" = "profiles"
"skills" = "skills"
"scripts/markdown_gate_check.py" = "scripts/markdown_gate_check.py"

[tool.hatch.build.targets.wheel.force-include]
"adapters" = "acdd/share/adapters"
"examples" = "acdd/share/examples"
"profiles" = "acdd/share/profiles"
"skills" = "acdd/share/skills"
"scripts/markdown_gate_check.py" = "acdd/share/scripts/markdown_gate_check.py"

[dependency-groups]
dev = [
  "basedpyright>=1.28.0",
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.8.0",
  "twine>=5.0.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.basedpyright]
include = ["src", "tests"]

typeCheckingMode = "basic"
# Lean validator codebase is still largely unannotated; keep CI green like the
# grid-view-spec job shape while typing catches up.
reportMissingTypeArgument = "none"
reportImportCycles = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "none"
reportUnusedCallResult = "none"
reportAny = "none"
reportPrivateUsage = "none"
reportImplicitStringConcatenation = "none"
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportCallIssue = "none"
reportArgumentType = "none"
reportConstantRedefinition = "none"
reportReturnType = "none"
reportAssignmentType = "none"
reportAttributeAccessIssue = "none"
reportGeneralTypeIssues = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryContains = "none"
reportUnannotatedClassAttribute = "none"
