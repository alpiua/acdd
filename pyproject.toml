[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acdd"
version = "0.4.2"
description = "ACDD — Agentic Contract-Driven Development"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "Oleksii Pylypchuk", email = "oleksii.pylypchuk@tuta.com" },
]
keywords = [
  "acdd",
  "agentic",
  "agents",
  "agentic-workflow",
  "contract-driven-development",
  "evidence",
  "validator",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/alpiua/acdd"
Repository = "https://github.com/alpiua/acdd"
Issues = "https://github.com/alpiua/acdd/issues"
Documentation = "https://github.com/alpiua/acdd#readme"

[project.scripts]
acdd = "acdd.cli:main"

[tool.setuptools.packages.find]
include = ["acdd", "acdd.*"]

[tool.setuptools.package-data]
"acdd.share" = [
  "AGENTS.md",
  "DESIGN.md",
  "profiles/**/*.yaml",
  "skills/**/*.md",
  "adapters/**/*.yaml",
  "examples/**/*.md",
  "scripts/**/*.py",
]

[dependency-groups]
dev = [
  "basedpyright>=1.28.0",
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.8.0",
  "twine>=5.0.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.basedpyright]
include = ["acdd", "tests"]
typeCheckingMode = "basic"
# Lean validator codebase is still largely unannotated; keep CI green like the
# grid-view-spec job shape while typing catches up.
reportMissingTypeArgument = "none"
reportImportCycles = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "none"
reportUnusedCallResult = "none"
reportAny = "none"
reportPrivateUsage = "none"
reportImplicitStringConcatenation = "none"
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportCallIssue = "none"
reportArgumentType = "none"
reportConstantRedefinition = "none"
reportReturnType = "none"
reportAssignmentType = "none"
reportAttributeAccessIssue = "none"
reportGeneralTypeIssues = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryContains = "none"
reportUnannotatedClassAttribute = "none"



