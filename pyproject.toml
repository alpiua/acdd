[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acdd"
version = "0.3.0"
description = "ACDD — Architecture Contract-Driven Development"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
acdd = "acdd.cli:main"

[tool.setuptools]
packages = ["acdd"]

[dependency-groups]
dev = ["pytest>=8"]
